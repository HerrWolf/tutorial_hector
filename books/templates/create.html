{% extends "layout/base.html" %} 

{% load static %} 

{% block content %}

<div class="row w-100">
  <div class="col-12 mb-4">
    <p class="d-inline-flex gap-1">
      <a class="btn btn-outline-primary" href="{% url 'books-view' %}">
        <i class="bi bi-box-arrow-left me-1"></i>
        Back to Books
      </a>
    </p>
  </div>
</div>

<div class="container d-flex flex-column justify-content-center align-items-center">
  <div class="row justify-content-center w-100">
    <div class="col-md-6">
      <div class="card card-primary card-outline mb-4">
        <div class="card-header">
          <div class="card-title">Create a new Book</div>
        </div>
        <form method="post">
          {% csrf_token %}
          <div class="card-body">
            <div class="mb-3">
              <label for="{{ form.title.id_for_label }}" class="form-label">Title</label>
              {{ form.title }}
            </div>
            <div class="mb-3">
              <label for="{{ form.author.id_for_label }}" class="form-label">Author</label>
              {{ form.author }}
            </div>
            <div class="mb-3">
              <label for="{{ form.publisher.id_for_label }}" class="form-label">Publisher</label>
              {{ form.publisher }}
            </div>
            <div class="mb-3">
              <label for="{{ form.published_date.id_for_label }}" class="form-label">Published Date</label>
              {{ form.published_date }}
            </div>
          </div>
          <div class="card-footer">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-floppy me-1"></i>
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
